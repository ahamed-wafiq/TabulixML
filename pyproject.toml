[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacraft"
version = "1.0.0"
description = "Lightweight tabular ML data cleaning, exploratory analysis, preprocessing, and automated machine learning toolkit."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "DataCraft contributors" }]
keywords = ["data-cleaning", "pandas", "machine-learning", "tabular", "datacraft", "automl", "eda", "preprocessing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "scikit-learn>=1.0",
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["datacraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
